services:

  frontend:
    build:
      context: ../test-project
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ../test-project/src

  backend:
    build:
      context: ../Back-End
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      - APP_KEY=base64:olzN9covU4GxTbD2Vtu0Wv5b9oBhhEgge5UCpcHVgY0=
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=back_end
      - DB_USERNAME=root
      - DB_PASSWORD=StrongPass123!
    depends_on:
      database:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ../Back-End/app

  database:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=StrongPass123!
      - MYSQL_DATABASE=back_end
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pStrongPass123!"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:

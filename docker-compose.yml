version: '3.8'

services:

  frontend:
    build:
      context: ../test-project
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend:
    build:
      context: ../Back-End
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=back_end
      - DB_USERNAME=laravel
      - DB_PASSWORD=StrongPass123!
    depends_on:
      - database

  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=StrongPass123!
      - MYSQL_DATABASE=back_end
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

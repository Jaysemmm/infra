services:

  frontend:
    build:
      context: ../test-project
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ../test-project:/app        
      - /app/node_modules           
    depends_on:
      - backend

  backend:
    build:
      context: ../Back-End
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ../Back-End:/var/www/html   
    environment:
      - APP_KEY=${APP_KEY}
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=back_end
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=back_end
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pStrongPass123!"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
